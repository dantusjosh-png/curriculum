# The Professor: auto-grades submissions filed from the site.
#
# Trigger: an issue labeled 'submission' or 'quiz-log' is opened.
# Requires: repo secret ANTHROPIC_API_KEY (until it's set, runs fail quietly
# and grading happens in Claude Code sessions instead).
#   Enable with:  gh secret set ANTHROPIC_API_KEY
name: Professor

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  grade:
    if: >-
      github.event.issue.user.login == 'dantusjosh-png' &&
      (contains(github.event.issue.labels.*.name, 'submission') ||
       contains(github.event.issue.labels.*.name, 'quiz-log'))
    runs-on: ubuntu-latest
    concurrency:
      group: professor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--allowedTools 'Bash,Read,Edit,Write,Glob,Grep' --model claude-sonnet-5"
          prompt: |
            You are the professor for this interactive curriculum site. Read
            how-it-works.md for the pedagogical framework. A student submission
            just arrived as issue #${{ github.event.issue.number }} from the
            student (the repo owner). Handle it:

            1. Read the issue: `gh issue view ${{ github.event.issue.number }} --json title,body,labels`

            2. Identify which course and module it belongs to (the issue body
               links the module page under courses/). Read that module page for
               the lecture content and questions.

            3. If it is labeled 'submission' (discussion answers or an exercise):
               - Grade rigorously but encouragingly, in the voice of a professor
                 mentoring an advanced student. For each answer: what's right,
                 what's missing or wrong, and the sharpest one-sentence
                 correction. End with a verdict: PASS (ready to advance) or
                 RETEACH (name exactly which concept needs another pass).
               - Post the full feedback as a comment on the issue.
               - Update the module page: under "## Discussion" (or
                 "## Application"), replace the placeholder with a concise log —
                 date, a 2-3 sentence summary of the student's answers, the key
                 feedback points, and the verdict. Keep the original questions
                 and interactive widgets intact.
               - If the verdict is PASS and this was the module's final
                 requirement, update "## Review" with the verdict, set the
                 module's status to Complete on the module page and the course
                 index syllabus table, and bump the progress count on the home
                 page catalog (index.md).
               - If PASS on discussion (not the final requirement), write the
                 application exercise assignment into "## Application": one
                 short, concrete exercise applying the module's concepts to the
                 student's real work (they trade NQ futures, write, and build
                 software), with an answer box widget:
                 <div class="cc-answer" data-id="<course>-m<N>-app" data-title="Application — <short name>"></div>

            4. If it is labeled 'quiz-log': record the score with date under
               "## Review" on the module page (keep it brief, one line).

            5. Commit all page changes directly to main with message
               "Grade: <issue title>" and push. Then close the issue with a
               one-line closing comment pointing to the updated module page.

            Constraints: never edit files outside the course pages, index.md,
            or how-it-works.md. Never remove interactive widgets. Never invent
            scores. If the issue is malformed or empty, comment asking for a
            resubmission and leave it open.
